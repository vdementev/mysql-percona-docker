name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "55 3 * * 1" # weekly rebuild: fresh base layers + package updates

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: vdementev/docker-workflows/.github/workflows/build-image.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      image: mysql-percona
      push: ${{ github.event_name != 'pull_request' }}
      test-command: ./tests.sh
      # Tags come out of the built image, not out of the Dockerfile ARG, so a
      # published tag can never claim a server version the image does not run:
      # 8.4.11-11 and 8.4, next to latest.
      version-command: docker run --rm --entrypoint mysqld "$IMAGE" --version | sed -n 's/.* Ver \([^ ]*\) for .*/\1/p'
      tags: |
        type=raw,value=latest
      labels: |
        org.opencontainers.image.title=mysql-percona
        org.opencontainers.image.description=Percona Server for MySQL 8.4 LTS on Debian slim — XtraBackup included, jemalloc, auto TLS, Docker-secrets support, unprivileged mysql user.
        org.opencontainers.image.url=https://hub.docker.com/r/dementev/mysql-percona
        org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.vendor=Lotus Web Agency
        org.opencontainers.image.authors=Vasilii Dementev https://vasiliidementev.com
        org.opencontainers.image.licenses=MIT
    secrets: inherit

  sync-description:
    if: github.event_name != 'pull_request'
    needs: build
    uses: vdementev/docker-workflows/.github/workflows/sync-description.yml@v1
    with:
      image: mysql-percona
      # Docker Hub caps this at 100 characters.
      short-description: "Percona Server for MySQL 8.4 LTS on Debian slim, XtraBackup built in, auto TLS, no root."
    secrets: inherit
